### Production ################################################################
# docker compose up --build
#
# Frontend (Nginx):  http://localhost
# API (internal):    http://api:8000   (not exposed — nginx proxies /api/*)
# DB (psql access):  localhost:5432

services:
  frontend:
    build:
      context: ./frontend
      # VITE_API_URL is relative so nginx on the same origin routes it correctly
      args:
        VITE_API_URL: /api/v1
        VITE_APP_NAME: MedServicePrice.kz
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./backend/.env
    ports:
      # Expose so you can connect with psql / DBeaver directly
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
