### Development ###############################################################
# docker compose -f docker-compose.dev.yml up
#
# Frontend (Vite HMR): http://localhost:5173
# API (FastAPI):        http://localhost:8000
# DB (psql access):     localhost:5432
#
# Source code is mounted — changes are reflected immediately without rebuild.

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Named volume so node_modules live inside the container and aren't
      # overwritten by the host mount (avoids platform-native binary issues)
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      # Browser talks directly to the exposed backend port
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_APP_NAME: MedServicePrice.kz
    # --host 0.0.0.0 makes Vite reachable from outside the container
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  frontend_node_modules:
